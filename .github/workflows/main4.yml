name: main4

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: docker4
  cancel-in-progress: true

jobs:
  run-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Docker container
        run: |
          docker run \
            --cap-add=NET_ADMIN \
            --device=/dev/net/tun \
            pascallecze/tww
